aid: shazam
name: Shazam
description: Shazam is Apple's music recognition service that identifies songs from audio
  fingerprints. The Shazam API provides song recognition, music charts, and artist and
  track metadata retrieval. Originally launched in 2002 and acquired by Apple in 2018,
  Shazam processes over 1 billion song identifications per month. Official developer
  access is available via Apple's ShazamKit framework for iOS, macOS, tvOS, visionOS,
  watchOS, and Android. A third-party REST API is also available through RapidAPI for
  song detection, chart data, and artist lookups.
