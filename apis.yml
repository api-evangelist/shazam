apis:
- aid: shazam:shazamkit
  name: ShazamKit
  description: >-
    ShazamKit is Apple's official framework for integrating Shazam music recognition into iOS, macOS,
    tvOS, visionOS, watchOS, and Android applications. It supports matching audio against Shazam's global
    music catalog or custom audio catalogs built from prerecorded content. Authentication uses a JWT developer
    token signed with a Media Services private key created in the Apple Developer account. Audio signatures
    are generated client-side and never shared with Apple, preserving user privacy.
  humanURL: https://developer.apple.com/shazamkit/
  baseURL: https://developer.apple.com/shazamkit/
  tags:
  - Music Recognition
  - Audio Fingerprinting
  - iOS SDK
  - Android SDK
  - Custom Catalogs
  - Media Library
  properties:
  - type: Documentation
    url: https://developer.apple.com/shazamkit/
  - type: SDKDocumentation
    url: https://developer.apple.com/documentation/shazamkit/
  - type: AndroidSDK
    url: https://developer.apple.com/download/all/?q=Android%20ShazamKit
  - type: Authentication
    url: >-
      https://developer.apple.com/help/account/capabilities/create-a-media-identifier-and-private-key/
  - type: GettingStarted
    url: https://developer.apple.com/help/account/services/shazamkit/
  - type: DesignGuidelines
    url: https://developer.apple.com/design/human-interface-guidelines/shazamkit
  features:
  - type: MusicRecognition
    description: >-
      Identify songs from audio samples against Shazam's global catalog of over 1 billion tracks
  - type: CustomCatalogs
    description: >-
      Build recognition catalogs from prerecorded audio for podcasts, videos, and custom content
  - type: AudioSync
    description: Determine match position within a song for synchronized second-screen experiences
  - type: MediaLibrary
    description: Maintain a persistent library of user's Shazam discoveries within the app
  - type: CrossPlatform
    description: Native SDKs for all Apple platforms (iOS, macOS, tvOS, visionOS, watchOS) and Android
  useCases:
  - type: SongIdentification
    description: Identify currently playing music in a listening environment
  - type: SecondScreen
    description: Sync app content with broadcast audio or prerecorded media
  - type: PodcastEnhancement
    description: Add interactive overlays timed to podcast audio segments
  - type: MusicDiscovery
    description: Surface song metadata and streaming links upon recognition
