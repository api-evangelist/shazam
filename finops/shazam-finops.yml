description: >-
  FOCUS-aligned FinOps profile for Shazam API consumption. Two cost models exist: (1) Apple ShazamKit
  is bundled within the Apple Developer Program subscription ($99/year individual, $299/year org) with
  no per-request charges; (2) the third-party Shazam REST API on RapidAPI uses tiered subscription
  pricing ($24.99–$999.99/month) with pay-as-you-go overage at $0.0162435 per successful request
  beyond the included quota. Cost optimization centers on minimizing failed recognition attempts and
  right-sizing the RapidAPI subscription tier to actual monthly volume.
notes: Only successful HTTP 200 responses count against RapidAPI monthly quotas. Cache recognition
  results by audio fingerprint to avoid redundant API calls and reduce costs.
