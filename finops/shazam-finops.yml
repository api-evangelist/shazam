meters:
  - name: song_recognition_requests
    description: Number of successful song recognition API calls (POST audio to detect endpoint)
    unit: requests
    billedUnit: per request (overage)
    pricingModel: Included in subscription quota; $0.0162435/request overage
    notes: Only HTTP 200 responses count against quota and overage billing.

  - name: chart_requests
    description: Number of chart data API calls (top tracks by country, city, genre)
    unit: requests
    billedUnit: per request (overage)
    pricingModel: Included in subscription quota; $0.0162435/request overage
    notes: Counted against same monthly quota as recognition requests.

  - name: artist_track_metadata_requests
    description: Number of artist profile and track metadata API calls
    unit: requests
    billedUnit: per request (overage)
    pricingModel: Included in subscription quota; $0.0162435/request overage
    notes: Counted against same monthly quota as recognition requests.

costOptimization:
  strategies:
    - name: Cache recognition results
      description: Cache audio fingerprint-to-track mappings to avoid re-calling the recognition
        endpoint for previously identified audio segments.
      impact: high

    - name: Right-size subscription tier
      description: Monitor actual monthly request volume and select the RapidAPI tier whose included
        quota closely matches usage to avoid paying for unused capacity or incurring overage charges.
      impact: high

    - name: Minimize failed requests
      description: Only successful HTTP 200 responses count against quota; pre-validate audio length
        (3-5 seconds optimal) and format before submitting to avoid 400/422 errors that still
        consume API call budget on some providers.
      impact: medium

    - name: Use ShazamKit for client-side apps
      description: For iOS/macOS/Android apps, prefer ShazamKit over the RapidAPI wrapper since
        ShazamKit has no per-request charges and Apple processes recognition server-side at no
        additional cost to the developer.
      impact: high

    - name: Batch chart data with caching
      description: Chart data changes infrequently; cache chart responses for 30–60 minutes to
        reduce redundant requests against the monthly quota.
      impact: medium
